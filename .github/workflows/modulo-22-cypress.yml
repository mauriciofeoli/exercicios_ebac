name: Módulo 22 - Cypress

on:
  push:
    branches: [main, master]
    paths:
      - "modulo-22-e2e-cypress-docker-ci/**"
      - ".github/workflows/modulo-22-cypress.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "modulo-22-e2e-cypress-docker-ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modulo-22-e2e-cypress-docker-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulo-22-e2e-cypress-docker-ci

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modulo-22-e2e-cypress-docker-ci/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress
        run: npm run cypress:run

      - name: Gerar relatório HTML
        if: always()
        run: npm run generate:report

      - name: Upload do relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-modulo-22-e2e-cypress-docker-ci
          path: modulo-22-e2e-cypress-docker-ci/site

